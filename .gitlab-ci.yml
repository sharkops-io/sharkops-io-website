# This file is a template, and might need editing before it works on your project.
# Full project: https://gitlab.com/pages/plain-html
pages:
  image: node:latest
  stage: deploy
  script:
    - mkdir public
    - npm run build
    - cp -r dist/sharkops-io/* public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  only:
    - master
