build:
  image: node:latest
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r dist/sharkops-io/* public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  only:
    - master
